<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New CCTV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container mt-5">
    <h2>Add New CCTV</h2>

    <form action="/add_cctv" method="POST">
        <!-- Project Code Dropdown -->
        <div class="mb-3">
            <label for="projCode" class="form-label">Project Code:</label>
            <select id="projCode" name="projCode" class="form-select" required>
                <option value="">-- Select Project Code --</option>
                {% for project in projects %}
                    <option value="{{ project[0] }}">{{ project[0] }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- PBT Code Dropdown (Populated based on Project Code) -->
        <div class="mb-3">
            <label for="pbtCode" class="form-label">PBT Code:</label>
            <select id="pbtCode" name="pbtCode" class="form-select" required>
                <option value="">-- Select PBT Code --</option>
            </select>
        </div>

        <!-- Node Code Dropdown -->
        <div class="mb-3">
            <label for="nodeCode" class="form-label">Node Code:</label>
            <select id="nodeCode" name="nodeCode" class="form-select" required>
                <option value="">-- Select Node Code --</option>
                {% for node in nodes %}
                    <option value="{{ node[0] }}">{{ node[0] }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Zone ID and Wilayah ID -->
        <div class="mb-3">
            <label for="zoneID" class="form-label">Zone ID:</label>
            <input type="text" id="zoneID" name="zoneID" class="form-control" readonly>
        </div>

        <div class="mb-3">
            <label for="wilayahID" class="form-label">Wilayah ID:</label>
            <input type="text" id="wilayahID" name="wilayahID" class="form-control" readonly>
        </div>

        <!-- Coordinates and Postcode -->
        <div class="mb-3">
            <label for="coordiNorth" class="form-label">Coordinate North:</label>
            <input type="text" id="coordiNorth" name="coordiNorth" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="coordiEast" class="form-label">Coordinate East:</label>
            <input type="text" id="coordiEast" name="coordiEast" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="postcode" class="form-label">Postcode:</label>
            <input type="text" id="postcode" name="postcode" class="form-control" required>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Add CCTV</button>
    </form>
</div>

<script>
    // Fetch PBT Codes based on Project Code
    $('#projCode').change(function() {
        var projCode = $(this).val();
        if (projCode) {
            $.getJSON('/get_pbt_codes/' + projCode, function(data) {
                $('#pbtCode').html('<option value="">-- Select PBT Code --</option>');
                $.each(data, function(index, pbt) {
                    $('#pbtCode').append('<option value="' + pbt[0] + '">' + pbt[0] + '</option>');
                });
            });
        } else {
            $('#pbtCode').html('<option value="">-- Select PBT Code --</option>');
        }
    });

    // Fetch Zone and Wilayah based on Node Code
    $('#nodeCode').change(function() {
        var nodeCode = $(this).val();
        if (nodeCode) {
            $.getJSON('/get_zone_wilayah/' + nodeCode, function(data) {
                $('#zoneID').val(data[0]);
                $('#wilayahID').val(data[1]);
            });
        }
    });
</script>

</body>
</html>
