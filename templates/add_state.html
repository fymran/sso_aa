<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New State</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Homepage</a>

    <h3>Add New State</h3>
    <form action="{{ url_for('state.add_state') }}" method="POST">
        <div class="mb-3">
            <label for="stateName" class="form-label">State Name</label>
            <input type="text" class="form-control" id="stateName" name="stateName" required>
        </div>
        <button type="submit" class="btn btn-success">Add State</button>
    </form>
</div>
</body>
</html>
