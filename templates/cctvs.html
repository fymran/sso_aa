<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="container mt-5">
    <h2>CCTV List</h2>
    <a href="/add_cctv" class="btn btn-primary mb-3">Add New CCTV</a>
    <div class="mb-3">
        <label for="projCode" class="form-label">Select Project Code:</label>
        <select id="projCode" class="form-select">
            <option value="">-- Select Project Code --</option>
            {% for project in projects %}
                <option value="{{ project[0] }}">{{ project[0] }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <button id="filterByPBT" class="btn btn-primary">Filter by PBT</button>
        <button id="filterByZone" class="btn btn-secondary">Filter by Zone</button>
    </div>

    <div id="cctvContainer"></div>

    <script>
        $(document).ready(function() {
            $('#filterByPBT').click(function() {
                const projCode = $('#projCode').val();
                if (projCode) {
                    $.get(`/filter_cctvs_by_pbt/${projCode}`, function(data) {
                        $('#cctvContainer').html(data);
                    });
                } else {
                    alert("Please select a project code.");
                }
            });

            $('#filterByZone').click(function() {
                const projCode = $('#projCode').val();
                if (projCode) {
                    $.get(`/filter_cctvs_by_zone/${projCode}`, function(data) {
                        $('#cctvContainer').html(data);
                    });
                } else {
                    alert("Please select a project code.");
                }
            });
        });
    </script>
</div>
</body>
</html>
