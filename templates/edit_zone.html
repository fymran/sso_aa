<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3>Edit Zone</h3>
    <form action="{{ url_for('zone.edit_zone', zoneID=zone[0]) }}" method="POST">
        <div class="mb-3">
            <label for="zoneName" class="form-label">Zone Name</label>
            <input type="text" class="form-control" id="zoneName" name="zoneName" value="{{ zone[1] }}" required>
        </div>
        <div class="mb-3">
            <label for="wilayahID" class="form-label">Wilayah</label>
            <select class="form-control" id="wilayahID" name="wilayahID" required>
                {% for wilayah in wilayahs %}
                <option value="{{ wilayah[0] }}" {% if zone[2] == wilayah[0] %}selected{% endif %}>{{ wilayah[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Update Zone</button>
    </form>
</div>
</body>
</html>
