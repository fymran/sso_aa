<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage States</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>State List</h2>
    <a href="{{ url_for('state.add_state') }}" class="btn btn-success mb-3">Add New State</a>
    
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>State Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for state in states %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ state[1] }}</td>
                <td>
                    <a href="{{ url_for('state.edit_state', stateCode=state[0]) }}" class="btn btn-primary">Edit</a>
                    <form action="{{ url_for('state.delete_state', stateCode=state[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>        
    </table>
</div>
</body>
</html>
