<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit IFES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Edit IFES</h2>
    <form action="{{ url_for('ifes.edit_ifes', ifesID=ifes[0]) }}" method="POST">
        <div class="mb-3">
            <label for="ifesName" class="form-label">IFES Name</label>
            <input type="text" class="form-control" id="ifesName" name="ifesName" value="{{ ifes[1] }}" required>
        </div>
        <div class="mb-3">
            <label for="ifesEmail" class="form-label">IFES Email</label>
            <input type="email" class="form-control" id="ifesEmail" name="ifesEmail" value="{{ ifes[2] }}" required>
        </div>
        <div class="mb-3">
            <label for="wilayahID" class="form-label">Wilayah</label>
            <select class="form-control" id="wilayahID" name="wilayahID" required>
                {% for wilayah in wilayahs %}
                <option value="{{ wilayah[0] }}" {% if wilayah[0] == ifes[3] %} selected {% endif %}>{{ wilayah[1] }} ({{ wilayah[2] }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Update IFES</button>
    </form>    
</div>
</body>
</html>
