<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBT List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>PBT List</h2>
    <a href="/add_pbt" class="btn btn-primary mb-3">Add New PBT</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>PBT Code</th>
                <th>PBT Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for pbt in pbts %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ pbt[1] }}</td>
                <td>{{ pbt[2] }}</td>
                <td>
                    <a href="/edit_pbt/{{ pbt[0] }}" class="btn btn-sm btn-warning">Edit</a>
                    <form action="/delete_pbt/{{ pbt[0] }}" method="POST" style="display:inline-block;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
