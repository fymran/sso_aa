<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Nodes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Node List</h2>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Node Code</th>
                <th>Node Name</th>
                <th>Zone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for node in nodes %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ node[1] }}</td>
                <td>{{ node[2] }}</td>
                <td>{{ node[3] or 'N/A' }}</td> <!-- Show 'N/A' if zoneName is NULL -->
                <td>
                    <a href="{{ url_for('node.edit_node', nodeID=node[0]) }}" class="btn btn-primary">Edit</a>
                    <form action="{{ url_for('node.delete_node', nodeID=node[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>        
    </table>

    <h3 class="mt-5">Add New Node</h3>
    <form action="{{ url_for('node.add_node') }}" method="POST">
        <div class="mb-3">
            <label for="nodeCode" class="form-label">Node Code</label>
            <input type="text" class="form-control" id="nodeCode" name="nodeCode" required>
        </div>
        <div class="mb-3">
            <label for="nodeName" class="form-label">Node Name</label>
            <input type="text" class="form-control" id="nodeName" name="nodeName" required>
        </div>
        <div class="mb-3">
            <label for="zoneID" class="form-label">Zone</label>
            <select class="form-control" id="zoneID" name="zoneID" required>
                {% for zone in zones %}
                <option value="{{ zone[0] }}">{{ zone[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Add Node</button>
    </form>    
</div>
</body>
</html>
