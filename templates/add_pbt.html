<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add PBT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Add New PBT</h2>
    <form action="/add_pbt" method="POST">
        <div class="mb-3">
            <label for="pbtCode" class="form-label">PBT Code</label>
            <input type="text" class="form-control" id="pbtCode" name="pbtCode" required>
        </div>
        <div class="mb-3">
            <label for="pbtName" class="form-label">PBT Name</label>
            <input type="text" class="form-control" id="pbtName" name="pbtName" required>
        </div>
        <button type="submit" class="btn btn-primary">Add PBT</button>
        <a href="/pbts" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
