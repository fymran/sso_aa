<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Projects List</h2>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Project Code</th>
                <th>Project Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for project in projects %}
            <tr>
                <td>{{ loop.index }}
                <td>{{ project[1] }}</td>
                <td>{{ project[2] }}</td>
                <td>
                    <a href="/edit_project/{{ project[0] }}" class="btn btn-primary">Edit</a>
                    <form action="{{ url_for('projects.delete_project', projID=project[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this project?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <h3 class="mt-5">Add New Project</h3>
    <form action="/add_project" method="POST">
        <div class="mb-3">
            <label for="projCode" class="form-label">Project Code</label>
            <input type="text" class="form-control" id="projCode" name="projCode" required>
        </div>
        <div class="mb-3">
            <label for="projName" class="form-label">Project Name</label>
            <input type="text" class="form-control" id="projName" name="projName" required>
        </div>
        <button type="submit" class="btn btn-success">Add Project</button>
    </form>
</div>
</body>
</html>
