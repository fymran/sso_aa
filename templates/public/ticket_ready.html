<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Ready</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

    <!-- Include the header template -->
    {% include 'public/sso_header.html' %}

<body>
<div class="container mt-5 mb-3">
    <h1>Ticket Ready</h1>

    <ul class="list-group">
        <li class="list-group-item mt-3">
            <form method="POST" id="ticket-form">
                <div class="row">
                    <!-- Left Section: Basic Ticket Details -->
                    <div class="col-md-6">
                        <h2>Basic Ticket Details</h2>
                        <div class="mb-3">
                            <label for="project" class="form-label">Project:</label>
                            <select class="form-control" name="project" id="project" required>
                                <option>Select Project</option>
                                {% for project in projects %}
                                    <option value="{{ project[0] }}" data-project-name="{{ project[2] }}">{{ project[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="pbt" class="form-label">Customer:</label>
                            <select class="form-control" name="pbt" id="pbt" required></select>
                        </div>
                    </div>

                    <!-- Right Section: Asset Details -->
                    <div class="col-md-6">
                        <h2>Asset Details</h2>
                        <div id="asset-section">
                            <div class="mb-3">
                                <label for="asset" class="form-label">Asset:</label>
                                <select name="asset" class="form-control" id="asset" required></select>
                            </div>
                            <div class="mb-3">
                                <label for="inc" class="form-label">INC:</label>
                                <input class="form-control" type="text" name="inc" id="inc" required>
                            </div>
                            <div class="mb-3">
                                <label for="inc2" class="form-label">JA VSM:</label>
                                <input class="form-control" type="text" name="inc2" id="inc2" required>
                            </div>
                            <div class="mb-3">
                                <label for="issue" class="form-label">Issue:</label>
                                <input class="form-control" name="issue" id="issue" required>
                            </div>
                            <button type="button" class="btn btn-success" onclick="generateEmail()">Generate Email</button>
                        </div>
                    </div>
                </div>
            </form>
        </li>
    </ul>
</div>

    <script>

        function confirmLogout(event) {
            // Display a confirmation dialog
            const isConfirmed = confirm("Are you sure you want to logout?");
            if (!isConfirmed) {
                 // Prevent the default action if the user cancels
                event.preventDefault();
            }
        }

        // Event listeners to trigger data loading
        $('#project').on('change', fetchPBT);
        $('#project, #pbt').on('change', fetchAssets);
        
        function fetchPBT() {
            let projectId = $('#project').val();
            if (projectId) {
                $.post("{{ url_for('ticket.fetch_pbts') }}", { project_id: projectId }, function (data) {
                    updateDropdown('#pbt', data, "Select Customer");
                });
            }
        }

        function fetchAssets() {
            let projectId = $('#project').val();
            let pbtId = $('#pbt').val();

            if (projectId && pbtId) {
                $.post("{{ url_for('ticket.fetch_assets') }}", { project_id: projectId, pbt_id: pbtId }, function (data) {
                    updateDropdown('#asset', data, "Select Asset");
                });
            }
        }

        function updateDropdown(selector, items, placeholderText) {
            $(selector).empty();
            if (placeholderText) {
                $(selector).append(new Option(placeholderText, '', true, true)).attr('disabled', false);
            }
            items.forEach(item => {
                $(selector).append(new Option(item[1], item[0]));
            });
        }

        function generateEmail() {
            let assetId = $('#asset').val();
            let assetName = $('#asset option:selected').text();
            let projectId = $('#project').val();
            let projName = $('#project option:selected').text();
            let projectName = $('#project option:selected').data('project-name');
            let customer = $('#pbt option:selected').text();
            let inc = $('#inc').val();
            let inc2 = $('#inc2').val();
            let issue = $('#issue').val();

            // Make a fetch request to load asset details
            $.post(`{{ url_for('ticket.fetch_detail', projectID='') }}${projectId}`, { asset_id: assetId }, function (data) {
                if (data.error) {
                    alert(data.error);
                    return;
                }
                let cust = data.pbtCode;
                let subject = `${data.wilayahCode || ''} | IFES | ${projName} | ${cust} | ${assetName} | ${issue}`;
                
                // Collect IFES emails and Member emails
                let ifesEmails = data.ifesEmails.join(",");
                let memberEmails = data.memberEmails.join(",");
                let costCentre = data.costCentre || "Unknown";
                
                let body = `Dear team\n\nKindly accept INC escalation\n\n`;
                body += `Project name: ${projectName} (${projName})\nCustomer: ${customer}\nCost Centre: ${costCentre}\n\n`;
                body += `${inc}\n${projName} / ${cust} / ${assetName} / ${issue}\n${inc2}\nPoskod: ${data.postcode}\n`;
                body += `TM Node: ${data.nodeCode}\nState/Wilayah: ${data.stateName} / ${data.wilayahName}\nZone: ZONE ${data.zoneName}\n\n\n`;

                let mailtoLink = `mailto:${ifesEmails}?cc=${memberEmails}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                window.location.href = mailtoLink;
            }).fail(function() {
                alert("Error fetching details.");
            });
        }
    </script>
</body>
</html>
