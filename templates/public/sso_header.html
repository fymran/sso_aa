<div class="container-fluid py-3 hstack gap-3 sticky-top" style="background-color: #17385c;">
    <!-- Offcanvas Menu Button -->
    <div class="">
        <a class="btn " data-bs-toggle="offcanvas" href="#offcanvasSSOMenu" role="button" aria-controls="offcanvasSSOMenu" style="color: white; background-color: #17385c;">
            <svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"></path>
            </svg>
        </a>
    </div>

    <!-- Welcome text with logo -->
    <div class="d-flex align-items-center">
        <a href="/sso_main_menu" class="text-decoration-none d-flex align-items-center">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" style="width: 170px; height: auto; margin-right: 1px; margin-left: 1px;">
            <h4 class="text-light m-0 ms-2" style="font-weight:bold;">WELCOME, {{ session['username'] | upper }}</h4>
        </a>
    </div>

    <div class="ms-auto">
        <a href="{{ url_for('logout') }}" class="btn btn-danger" onclick="confirmLogout(event)" >Logout</a>
    </div

    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSSOMenu" aria-labelledby="offcanvasSSOMenuLabel" style="background-color:rgba(23, 56, 92, 0.8);">
        <!-- Close button at the top-right -->
        <div class="d-flex justify-content-end mt-2 me-2">
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close" style="background-color:orange;"></button>
        </div>

         <!-- Logo and title below the close button -->
        <div class="text-center mt-3">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" style="width: 180px; height: auto;">
            <h5 class="offcanvas-title mt-2" id="offcanvasAdminMenuLabel" style="color: white; font-weight:bold; ">
            USERNAME : {{ session['username'] | upper }}</h5>
        </div>

        <div class="offcanvas-body">
            <p style="color:white;">Select an option:</p>
            <ul class="list-group">
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/sso_main_menu">Home</a>
                </li>
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="{{ url_for('ticket.remote_ticket_menu') }}">Ticket Escalation</a>
                </li>
                <li class="btn btn-warning list-group-item mb-5">
                    <a href="{{ url_for('maps.go_product') }}">Maps</a>
                </li>
                
            </ul>
            <!-- Logout Button -->
            <div class="mt-auto">
                <a href="{{ url_for('logout') }}" class="btn btn-danger list-group-item rounded" onclick="confirmLogout(event)" 
                style="background-color:red; color:white;" onmouseover="this.style.backgroundColor='#D20103'"onmouseout="this.style.backgroundColor='red'">
                    Logout
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    function confirmLogout(event) {
        // Display a confirmation dialog
        const isConfirmed = confirm("Are you sure you want to logout?");
        if (!isConfirmed) {
            // Prevent the default action if the user cancels
            event.preventDefault();
        }
    }
</script>
