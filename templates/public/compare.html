<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Location Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Select an Asset to View Location</h1>

    <!-- Asset Selection Dropdown with Predefined Assets -->
    <label for="asset">Choose Asset:</label>
    <select id="asset" name="asset">
        <option value="">Select an asset</option>
        <option value="asset1" data-coordi-north="3.1390" data-coordi-east="101.6869">Asset 1 - Kuala Lumpur</option>
        <option value="asset2" data-coordi-north="1.3521" data-coordi-east="103.8198">Asset 2 - Singapore</option>
        <option value="asset3" data-coordi-north="13.7563" data-coordi-east="100.5018">Asset 3 - Bangkok</option>
    </select>

    <!-- Buttons for Map Applications -->
    <div id="map-buttons" style="display:none;">
        <h2>Choose Map Application:</h2>
        <button id="go-to-coordinate">Go to Coordinate</button>
    </div>

    <script>
        let coordNorth, coordEast;

        // Event listener for asset selection
        $('#asset').on('change', function () {
            let selectedOption = $(this).find('option:selected');

            if (selectedOption.val()) {
                // Get predefined coordinates from the selected option's data attributes
                coordNorth = selectedOption.data('coordi-north');
                coordEast = selectedOption.data('coordi-east');
                
                // Show map options once coordinates are set
                $('#map-buttons').show();
            } else {
                $('#map-buttons').hide(); // Hide map options if no asset is selected
            }
        });

        // Open the coordinates in the map application
        $('#go-to-coordinate').on('click', function() {
            if (coordNorth && coordEast) {
                // Open navigation with a standard link
                window.open(`geo:${coordNorth},${coordEast}`, '_system'); // This will prompt navigation app selection
            } else {
                alert("Please select an asset first.");
            }
        });
        
    </script>
</body>
</html>
