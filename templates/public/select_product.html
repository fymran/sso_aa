<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

    <!-- Include the header template -->
    {% include 'public/sso_header.html' %}

<body>
    <div class="container mt-5 mb-3">
        <h1>Select Product</h1>
            
        <form method="POST" action="{{ url_for('maps.go_product') }}" onsubmit="return validateForm()">
            <label for="productID">Product:</label>
            <select name="productID" id="productID" class="form-control mt-3">
               <option value="">Select product</option> <!-- Default empty option -->
                {% for product in products %}
                    <option value="{{ product[0] }}">{{ product[1] }}</option>
                {% endfor %}
            </select>
                
            <button type="submit" class="btn btn-primary mt-3">Next</button>
        </form>
    </div>

    <!-- Bootstrap Modal for Custom Alert -->
    <div class="modal fade" id="errorModal" tabindex="-1" role="dialog" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">Error</h5>
                </div>
                <div class="modal-body">
                    You need to choose a product.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for Form Validation -->
    <script>
        function validateForm() {
            const productID = document.getElementById("productID").value;
            if (productID === "") {
                // Show the Bootstrap modal if no product is selected
                $('#errorModal').modal('show');
                return false;  // Prevent form submission
            }
            return true;  // Allow form submission
        }
    </script>
</body>
</html>
