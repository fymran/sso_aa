<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

    <!-- Include the header template -->
    {% include 'public/sso_header.html' %}

<body>
    <div class="container mt-3">
    <h1>Assets for Project: {{ projectCode }}</h1>
    <!-- Search Bars -->
    <div class="d-flex justify-content-center mb-3">
        <input type="text" id="assetSearch" class="form-control search-bar mr-2" placeholder="Search by Asset No" onkeyup="filterTable()">
        <input type="text" id="pbtSearch" class="form-control search-bar ml-2" placeholder="Search by PBT" onkeyup="filterTable()">
    </div>

    <!-- Assets Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-striped" id="assetTable">
            <thead class="thead-dark">
                <tr>
                    <th>Asset No</th>
                    <th>PBT</th>
                    <th>Address</th>
                    <th>Postcode</th>
                    <th>Node</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="assetTableBody">
                {% for asset in assets %}
                <tr>
                    <td>{{ asset[1] }}</td>
                    <td>{{ asset[2] }}</td>
                    <td>{{ asset[3] }}</td>
                    <td>{{ asset[6] }}</td>
                    <td>{{ asset[7] }}</td>
                    <td>
                        <button class="btn btn-primary" data-toggle="modal" data-target="#navigateModal" 
                            data-asset-no="{{ asset[1] }}" data-coordi-north="{{ asset[4] }}" data-coordi-east="{{ asset[5] }}" data-pbt-code="{{ asset[2] }}">
                            Navigate
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Pagination Controls -->
    <nav>
        <ul class="pagination" id="paginationControls">
            <!-- Pagination items will be dynamically added here -->
        </ul>
    </nav>

    <!-- Navigate Modal -->
    <div class="modal fade" id="navigateModal" tabindex="-1" role="dialog" aria-labelledby="navigateModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="navigateModalLabel">
                        Navigate to Asset: <span id="pbtCode"></span> - <span id="assetNo"></span>
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Google Maps iframe -->
                    <iframe id="googleMapFrame" width="100%" height="300" style="border:0;" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    
                    <!-- Navigation links -->
                    <a id="googleMapsLink" href="#" target="_blank" class="btn btn-primary btn-block mt-2 mb-2">Google Maps</a>
                    <a id="appleMapsLink" href="#" target="_blank" class="btn btn-primary btn-block mt-2 mb-2">Apple Maps</a>
                    <a id="wazeLink" href="#" target="_blank" class="btn btn-primary btn-block mt-2 mb-2">Waze</a>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap and jQuery scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        const rowsPerPage = 10;
        let currentPage = 1;
        let currentStartPage = 1;

        function displayPage(page) {
            const tableBody = document.getElementById("assetTableBody");
            const rows = tableBody.getElementsByTagName("tr");
            const totalRows = rows.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage);

            currentPage = page;
            for (let i = 0; i < totalRows; i++) {
                rows[i].style.display = (i >= (page - 1) * rowsPerPage && i < page * rowsPerPage) ? "" : "none";
            }

            updatePagination(totalPages);
        }

        function updatePagination(totalPages) {
            const paginationControls = document.getElementById("paginationControls");
            paginationControls.innerHTML = "";

            const maxVisiblePages = 5; // Number of page links to display at a time
            let endPage = Math.min(currentStartPage + maxVisiblePages - 1, totalPages);

            // "Previous" button
            const prevLi = document.createElement("li");
            prevLi.classList.add("page-item");
            prevLi.classList.toggle("disabled", currentStartPage === 1); // Disable if on the first set
            const prevLink = document.createElement("a");
            prevLink.classList.add("page-link");
            prevLink.href = "#";
            prevLink.textContent = "Previous";
            prevLink.onclick = function (e) {
                e.preventDefault();
                if (currentStartPage > 1) {
                    currentStartPage -= maxVisiblePages;
                    displayPage(currentStartPage);
                }
            };
            prevLi.appendChild(prevLink);
            paginationControls.appendChild(prevLi);

            // Page links within the visible range
            for (let i = currentStartPage; i <= endPage; i++) {
                const pageLi = createPaginationItem(i);
                paginationControls.appendChild(pageLi);
            }

            // "Next" button
            const nextLi = document.createElement("li");
            nextLi.classList.add("page-item");
            nextLi.classList.toggle("disabled", endPage >= totalPages); // Disable if on the last set
            const nextLink = document.createElement("a");
            nextLink.classList.add("page-link");
            nextLink.href = "#";
            nextLink.textContent = "Next";
            nextLink.onclick = function (e) {
                e.preventDefault();
                if (endPage < totalPages) {
                    currentStartPage += maxVisiblePages;
                    displayPage(currentStartPage);
                }
            };
            nextLi.appendChild(nextLink);
            paginationControls.appendChild(nextLi);
        }

        function createPaginationItem(page) {
            const li = document.createElement("li");
            li.classList.add("page-item");
            if (page === currentPage) li.classList.add("active");

            const a = document.createElement("a");
            a.classList.add("page-link");
            a.href = "#";
            a.textContent = page;
            a.onclick = function (e) {
                e.preventDefault();
                displayPage(page);
            };

            li.appendChild(a);
            return li;
        }

        document.addEventListener("DOMContentLoaded", function () {
            displayPage(currentPage);
        });

        function filterTable() {
            const assetSearch = document.getElementById("assetSearch").value.toLowerCase();
            const pbtSearch = document.getElementById("pbtSearch").value.toLowerCase();
            const tableBody = document.getElementById("assetTableBody");
            const rows = tableBody.getElementsByTagName("tr");
    
            for (let i = 0; i < rows.length; i++) {
                const assetNo = rows[i].getElementsByTagName("td")[0].textContent.toLowerCase();
                const pbt = rows[i].getElementsByTagName("td")[1].textContent.toLowerCase();
    
                // Display rows that match both search fields
                rows[i].style.display = (assetNo.includes(assetSearch) && pbt.includes(pbtSearch)) ? "" : "none";
            }
        }
    
        // Pagination update when filters are applied
        document.getElementById("assetSearch").addEventListener("input", function() {
            displayPage(1);
        });
        document.getElementById("pbtSearch").addEventListener("input", function() {
            displayPage(1);
        });
        
        // Triggered when the navigateModal is shown
        $('#navigateModal').on('show.bs.modal', function (event) {
            const button = $(event.relatedTarget);
            const assetNo = button.data('asset-no');
            const pbtCode = button.data('pbt-code');
            const coordiNorth = button.data('coordi-north');
            const coordiEast = button.data('coordi-east');

            // Display asset number
            document.getElementById('assetNo').textContent = assetNo;
            document.getElementById('pbtCode').textContent = pbtCode;

            // Set Google Maps iframe source using coordinates
            const googleMapFrame = document.getElementById('googleMapFrame');
            googleMapFrame.src = `https://www.google.com/maps?q=${coordiNorth},${coordiEast}&output=embed`;


            // Set navigation links
            document.getElementById('googleMapsLink').href = `https://www.google.com/maps/search/?api=1&query=${coordiNorth},${coordiEast}`;
            document.getElementById('appleMapsLink').href = `http://maps.apple.com/?ll=${coordiNorth},${coordiEast}`;
            document.getElementById('wazeLink').href = `https://www.waze.com/ul?ll=${coordiNorth},${coordiEast}&navigate=yes`;
        });

    </script>
</body>
</html>
