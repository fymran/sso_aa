<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

    <!-- Include the header template -->
    {% include 'public/sso_header.html' %}

<body>
<div class="container mt-5 mb-2">
    <h1>Request Ticket</h1>

    <ul class="list-group">
        <li class="list-group-item mt-3">
            <form method="POST" id="ticket-form">
                <div class="row">
                    <!-- Left Section: Basic Ticket Details -->
                    <div class="col-md-6">
                        <h2>Basic Ticket Details</h2>
                        <div class="mb-3">
                            <label for="project" class="form-label">Project:</label>
                            <select class="form-control" name="project" id="project" required>
                                <option>Select Project</option>
                                {% for project in projects %}
                                    <option value="{{ project[0] }}" data-project-name="{{ project[2] }}">{{ project[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="pbt" class="form-label">PBT:</label>
                            <select class="form-control" name="pbt" id="pbt" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="reporter" class="form-label">Reporter:</label>
                            <input type="text" class="form-control" name="reporter" id="reporter" required>
                        </div>
                    </div>

                    <!-- Right Section: Asset Details -->
                    <div class="col-md-6">
                        <h2>Asset Details</h2>
                        <div id="asset-section">
                            <div class="mb-3">
                                <label for="asset" class="form-label">Asset:</label>
                                <select name="asset" class="form-control" id="asset" required></select>    
                            </div>
                            <div class="mb-3">
                                <label for="ip" class="form-label">Asset IP:</label>
                                <input type="text" class="form-control" name="ip" id="ip" required>    
                            </div>
                            <div class="mb-3">
                                <label for="issue" class="form-label">Issue:</label>
                                <input name="issue" class="form-control" id="issue" required>  
                            </div>
                            <div class="mb-3">
                                <label for="serial" class="form-label">Asset Serial Number:</label>
                                <input type="text" class="form-control" name="serial" id="serial" required>
                            </div>
                            <div class="mb-3">
                                <label for="subtype" class="form-label">Subtype:</label>
                                <select class="form-control" name="subtype" id="subtype" required>
                                    <option value="reactive">Reactive</option>
                                    <option value="non-reactive">Non-Reactive</option>
                                </select>
                            </div>
                            <button type="button" class="btn btn-warning" onclick="addAsset()">Add Asset</button>
                            <button type="button" class="btn btn-success" onclick="generateEmail()">Generate Email</button>
                        </div>
                    </div>
                </div>
            </form>
        </li>
        <li class="list-group-item mt-3">
            <ul id="asset-list"></ul>
        </li>
    </ul>
</div>

    <script>
        class AssetTicket {
            constructor(assetId, assetName, assetIP, issue, serialNumber, subtype, product, wilayah) {
                this.assetId = assetId;
                this.assetName = assetName;
                this.assetIP = assetIP;
                this.issue = issue;
                this.serialNumber = serialNumber;
                this.subtype = subtype;
                this.product = product;
                this.wilayah = wilayah;
            }

            toTableRow(projName, projectName, accountName, index) {
                return `\n\nTT Number ${index + 1}: ${this.assetName} \n Assignment: IFES-${this.wilayah}\n |- Title: As below \n |- Description: ${projName} / ${this.assetName} / ${this.assetIP}/ ${this.issue}\n |- Asset: ${this.serialNumber} \n |- Subtype: ${this.subtype}\n |- Project Name: ${projectName}\n |- Account Name: ${accountName}\n |- Service: ${this.product}\n\n\n`;
            }
        }

        let assetTickets = [];

        //fetchPBT to load PBTs for the selected project
        $('#project').on('change', function () {
            fetchPBT();
        });

        // Fetch assets when project or PBT changes
        $('#project, #pbt').on('change', function () {
            fetchAssets();
        });
        
        function fetchPBT() {
            let projectId = $('#project').val();
            if (projectId) {
                $.post("{{ url_for('ticket.fetch_pbts') }}", { project_id: projectId }, function (data) {
                    updateDropdown('#pbt', data, "Select PBT");
                });
            }
        }

        function fetchAssets() {
            let projectId = $('#project').val();
            let pbtId = $('#pbt').val();

            if (projectId && pbtId) {
                $.post("{{ url_for('ticket.fetch_assets') }}", { project_id: projectId, pbt_id: pbtId }, function (data) {
                    updateDropdown('#asset', data, "Select Asset");
                });
            }
        }
        
        function updateDropdown(selector, items, placeholderText) {
            $(selector).empty();
    
           // Add placeholder option if provided
            if (placeholderText) {
                $(selector).append(new Option(placeholderText, '', true, true)).attr('disabled', false);
            }

            items.forEach(item => {
                $(selector).append(new Option(item[1], item[0]));
            });
        }

        // Add asset and fetch wilayah
        function addAsset() {
            let assetId = $('#asset').val();
            let assetName = $('#asset option:selected').text();
            let assetIP = $('#ip').val();
            let issue = $('#issue').val();
            let serialNumber = $('#serial').val();
            let subtype = $('#subtype').val();

            let projectId = $('#project').val();

            if (!assetId || assetTickets.some(a => a.assetId === assetId)) return;

            $.post(`{{ url_for('ticket.fetch_detail', projectID='') }}${projectId}`, { asset_id: assetId }, function (data) {
                let wilayahName = data.wilayahName || "Unknown";
                let product = data.product || "Unknown";
                let assetTicket = new AssetTicket(assetId, assetName, assetIP, issue, serialNumber, subtype, product, wilayahName);
                assetTickets.push(assetTicket);
                updateAssetList();
            }).fail(function() {
                alert("Error fetching wilayah.");
            });
        }

        function updateAssetList() {
            $('#asset-list').empty();
            assetTickets.forEach((asset, index) => {
                $('#asset-list').append(`<li>${asset.assetName} (Wilayah: ${asset.wilayah}) <button onclick="removeAsset(${index})">Remove</button></li>`);
            });
        }

        function removeAsset(index) {
            assetTickets.splice(index, 1);
            updateAssetList();
        }

        function generateEmail() {
            let projName = $('#project option:selected').text();
            let projectName = $('#project option:selected').data('project-name');
            let accountName = $('#pbt option:selected').text();
            let reporter = $('#reporter').val();
            let date = new Date().toLocaleDateString();
            let assetNames = assetTickets.map(a => a.assetName).join(" & ");
            let subject = `${projName} CCTV: Request to create INC CCTV ${assetNames} (${date})`;

            let body = `Please create INC ticket as per details below:\n\nReporter: ${reporter}\n\nPBT: ${accountName}\n\n\n`;

            assetTickets.forEach((asset, index) => {
                body += asset.toTableRow(projName, projectName, accountName, index);
            });

            let mailtoLink = `mailto:1060servicedesk@tm.com.my?cc=ssoc@tm.com.my&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoLink;
        }
    </script>
</body>
</html>
