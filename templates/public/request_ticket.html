<!DOCTYPE html>
<html>
<head><title>Request Ticket</title></head>
<body>
    <h1>Request Ticket</h1>
    <form method="POST">
        <label for="project">Project:</label>
        <select name="project" required>
            {% for project in projects %}
                <option value="{{ project[0] }}">{{ project[1] }}</option>
            {% endfor %}
        </select><br>

        <label for="pbt">PBT:</label>
        <select name="pbt" required>
            {% for pbt in pbts %}
                <option value="{{ pbt[0] }}">{{ pbt[1] }}</option>
            {% endfor %}
        </select><br>

        <label for="product">Product:</label>
        <select name="product" required>
            <option>Smart Security & Surveillance</option>
            <option>Smart Traffic Light</option>
            <option>Smart Building</option>
        </select><br>

        <label for="asset">Asset:</label>
        <select name="asset" >
            <!-- Asset options would be dynamically loaded based on project and PBT selections -->
        </select><br>

        <label for="inc_number">INC Number:</label>
        <input type="text" name="inc_number" required><br>

        <button onclick="generateEmail()" type="submit">Generate Email</button>
    </form>
    <script>
        function generateEmail() {
            var recipient = document.getElementById('recipient').value;
            var subject = document.getElementById('subject').value;
            var body = document.getElementById('body').value;
    
            var mailtoLink = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    
            window.location.href = mailtoLink;
        }
    </script>    
</body>
</html>
