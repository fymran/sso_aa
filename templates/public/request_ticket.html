<!DOCTYPE html>
<html lang>
<head>
    <title>Request Ticket</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Request Ticket</h1>
    <form method="POST">
        <label for="project">Project:</label>
        <select name="project" id="project" required>
            {% for project in projects %}
                <option value="{{ project[0] }}">{{ project[1] }}</option>
            {% endfor %}
        </select><br>

        <label for="pbt">PBT:</label>
        <select name="pbt" id="pbt" required>
            {% for pbt in pbts %}
                <option value="{{ pbt[0] }}">{{ pbt[1] }}</option>
            {% endfor %}
        </select><br>

        <label for="product">Product:</label>
        <select name="product" id="product" required>
            <option>Smart Security & Surveillance</option>
            <option>Smart Traffic Light</option>
            <option>Smart Building</option>
        </select><br>

        <label for="asset">Asset:</label>
        <select name="asset" id="asset" required></select>
        <button type="button" onclick="addAsset()">Add Asset</button><br>

        <ul id="asset-list"></ul>

        <label for="inc_number">INC Number:</label>
        <input type="text" name="inc_number" id="inc_number" required><br>

        <button type="button" onclick="generateEmail()">Generate Email</button>
    </form>

    <script>
        // Track selected assets
        let selectedAssets = [];

        // Fetch assets on project and PBT change
        $('#project, #pbt').on('change', function () {
            let project_id = $('#project').val();
            let pbt_id = $('#pbt').val();
            if (project_id && pbt_id) {
                $.post("{{ url_for('ticket.fetch_assets') }}", { project_id, pbt_id }, function (data) {
                    $('#asset').empty();
                    data.forEach(asset => $('#asset').append(new Option(asset[1], asset[0])));
                });
            }
        });

        // Add asset and fetch wilayah
        function addAsset() {
            let assetId = $('#asset').val();
            let assetName = $('#asset option:selected').text();
            let projectId = $('#project').val();  // Get the selected project ID

            // Ensure assetId and projectId are valid, and avoid duplicates
            if (!assetId || !projectId || selectedAssets.some(a => a.id === assetId)) return;

            // Fetch wilayah with projectId included in the URL
            $.post(`{{ url_for('ticket.fetch_wilayah', projectID='') }}${projectId}`, { asset_id: assetId }, function (data) {
                let wilayahName = data.wilayahName || "Unknown";
                selectedAssets.push({ id: assetId, name: assetName, wilayah: wilayahName });
                updateAssetList();
            }).fail(function() {
                alert("Error fetching wilayah.");
            });
        }


        // Update asset list in UI
        function updateAssetList() {
            $('#asset-list').empty();
            selectedAssets.forEach((asset, index) => {
                $('#asset-list').append(`<li>${asset.name} (Wilayah: ${asset.wilayah}) <button onclick="removeAsset(${index})">Remove</button></li>`);
            });
        }

        // Remove asset from list
        function removeAsset(index) {
            selectedAssets.splice(index, 1);
            updateAssetList();
        }

        // Generate email
        function generateEmail() {
            let project = $('#project option:selected').text();
            let pbt = $('#pbt option:selected').text();
            let product = $('#product').val();
            let incNumber = $('#inc_number').val();
            let date = new Date().toLocaleDateString();

            // Dynamic subject for multiple assets
            let assetNames = selectedAssets.map(a => a.name).join(", ");
            let subject = `${project} CCTV : Request to create INC for assets ${assetNames} on ${date}`;

            // Body content with each asset in tabular format
            let body = `Please create INC ticket as per details below:\n\nReported by:\nPBT: ${pbt}\n\nAssignment:\n`;
            selectedAssets.forEach(asset => {
                body += `
                | Title: ${project} / ${asset.name} /
                | Description: ${project} / ${asset.name} /
                | Asset: ${asset.name}
                | Subtype: 
                | Project Name: ${project}
                | Account Name: ${pbt}
                | Service: ${product}\n`;
            });

            // Mailto link
            let mailtoLink = `mailto:1060servicedesk@tm.com.my?cc=ssoc@tm.com.my&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoLink;
        }
    </script>
</body>
</html>
