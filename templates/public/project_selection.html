<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='image/ssoaa_logo.jpg') }}">  
</head>

    <!-- Include the header template -->
    {% include 'public/sso_header.html' %}

<body>
    <div class="container mt-5">
        <h1 style="color:cadetblue; font-weight: bold;">Select Project</h1>
            
        <form method="POST" action="{{ url_for('maps.find_asset', productID=1) }}" onsubmit="return validateForm()">
            <label for="projectID">Project:</label>
            <select name="projectID" id="projectID" class="form-control mt-3">
               <option value="">Select project</option> <!-- Default empty option -->
                {% for project in projects %}
                    <option value="{{ project[0] }}">{{ project[1] }}</option>
                {% endfor %}
            </select>
            <a href="{{ url_for('maps.go_product') }}" class="btn btn-secondary mt-3">Back</a>   
            <button type="submit" class="btn btn-warning mt-3">Search</button>
           
        </form>
    </div>
        
    <!-- Bootstrap Modal for Custom Alert -->
    <div class="modal fade" id="errorModal" tabindex="-1" role="dialog" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">Error</h5>
                </div>
                <div class="modal-body">
                    You need to choose a project.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript for Form Validation -->
    <script>
        function validateForm() {
            const projectID = document.getElementById("projectID").value;
            if (projectID === "") {
                // Show the Bootstrap modal if no project is selected
                $('#errorModal').modal('show');
                return false;  // Prevent form submission
            }
            return true;  // Allow form submission
        }
    </script>
</body>
</html>
