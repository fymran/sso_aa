<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage IFES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>IFES List</h2>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Email</th>
                <th>Wilayah</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for ifes in ifes %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ ifes[1] }}</td>
                <td>{{ ifes[2] }}</td>
                <td> {{ ifes[4] }}</td> <!-- Show wilayahName (wilayahCode) -->
                <td>
                    <a href="{{ url_for('ifes.edit_ifes', ifesID=ifes[0]) }}" class="btn btn-primary">Edit</a>
                    <form action="{{ url_for('ifes.delete_ifes', ifesID=ifes[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>        
    </table>

    <h3 class="mt-5">Add New IFES</h3>
    <form action="{{ url_for('ifes.add_ifes') }}" method="POST">
        <div class="mb-3">
            <label for="ifesName" class="form-label">IFES Name</label>
            <input type="text" class="form-control" id="ifesName" name="ifesName" required>
        </div>
        <div class="mb-3">
            <label for="ifesEmail" class="form-label">IFES Email</label>
            <input type="email" class="form-control" id="ifesEmail" name="ifesEmail" required>
        </div>
        <div class="mb-3">
            <label for="wilayahID" class="form-label">Wilayah</label>
            <select class="form-control" id="wilayahID" name="wilayahID" >
                {% for wilayah in wilayahs %}
                <option value="{{ wilayah[0] }}">{{ wilayah[1] }} ({{ wilayah[2] }})</option>
                {% endfor %}
            </select>
        </div>        
        <button type="submit" class="btn btn-success">Add IFES</button>
    </form>    
</div>
</body>
</html>
