<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assets</title>
</head>
<body>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Homepage</a>

    <h1>Assets for Project ID: {{ projectID }}</h1>
    <a href="{{ url_for('asset.add_asset', projectID=projectID) }}">Add New Asset</a>
    <table border="1">
        <thead>
            <tr>
                <th>Asset ID</th>
                <th>PBT ID</th>
                <th>Address</th>
                <th>Coordi North</th>
                <th>Coordi East</th>
                <th>Postcode</th>
                <th>Node ID</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for asset in assets %}
            <tr>
                <td>{{ asset[0] }}</td>
                <td>{{ asset[1] }}</td>
                <td>{{ asset[2] }}</td>
                <td>{{ asset[3] }}</td>
                <td>{{ asset[4] }}</td>
                <td>{{ asset[5] }}</td>
                <td>{{ asset[6] }}</td>
                <td>
                    <a href="{{ url_for('asset.edit_asset', projectID=projectID, assetID=asset[0], pbtID=asset[1]) }}">Edit</a> | 
                    <form action="{{ url_for('asset.delete_asset', projectID=projectID, assetID=asset[0], pbtID=asset[1]) }}" method="POST" style="display:inline;">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
