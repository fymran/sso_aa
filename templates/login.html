<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='image/ssoaa_logo.jpg') }}">
    
    <style>
        /* Centering the form on the page */
        body, html {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('{{ url_for("static", filename="image/background.jpeg") }}') no-repeat center center fixed;
            background-size: cover; /* Ensures the image covers the entire background */
            margin: 0
        }

        /* Fixed container size with responsive adjustments */
        .container {
            width: 400px;
            max-width: 400px; /* Fixed maximum width */
            min-height: 400px; /* Adjusted height for logo */
            background-color:rgba(23, 56, 92, 0.88);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
        }

        .logo {
            width: 200px;
            height: auto;
            margin-bottom: 20px; /* Adjusted space between logo and heading */
            display: block; /* Ensures it's treated as a block element */
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            font-size: 20px;
            text-align: center; /* Center-align logo and heading */
            color: white;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .form-label {
            text-align: left; /* Center-align logo and heading */
            font-weight: bold;
            color: white;
            
        }

        .form-control {
            text-align: left; /* Center-align logo and heading */
            border-radius: 5px;
            border: 1px solid #ced4da;
        }

        .btn-primary {
            width: 100%;
            background-color:rgb(202, 137, 15);
            border-color: rgb(202, 137, 15);
        }

        .btn-primary:hover {
            background-color: #2c6d70;
            border-color: #2c6d70;
        }

        .alert {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo at the top -->
        <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Company Logo" class="logo">
        <h2>Welcome,<h2>
        <h2>Please login to access SSO-AA</h2>
        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning">
                {{ messages[0] }}
            </div>
        {% endif %}
        {% endwith %}
    </div>
</body>
</html>
