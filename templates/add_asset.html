<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Asset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Homepage</a>

    <h2>Add New Asset</h2>
    <form action="{{ url_for('asset.add_asset', projectID=projectID) }}" method="POST">
        <div class="mb-3">
            <label for="pbtID" class="form-label">PBT Code</label>
            <select class="form-control" id="pbtID" name="pbtID" required>
                <option value="" disabled selected>Select PBT</option>
                {% for pbt in pbts %}
                <option value="{{ pbt[0] }}">{{ pbt[1] }}</option> <!-- pbtID value and pbtCode displayed -->
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="assetID" class="form-label">Asset ID</label>
            <input type="text" class="form-control" id="assetID" name="assetID" required>
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address" >
        </div>
        <div class="mb-3">
            <label for="coordiNorth" class="form-label">Coordinate North</label>
            <input type="number" step="0.000001" class="form-control" id="coordiNorth" name="coordiNorth" required>
        </div>
        <div class="mb-3">
            <label for="coordiEast" class="form-label">Coordinate East</label>
            <input type="number" step="0.000001" class="form-control" id="coordiEast" name="coordiEast" required>
        </div>
        <div class="mb-3">
            <label for="postcode" class="form-label">Postcode</label>
            <input type="text" class="form-control" id="postcode" name="postcode" >
        </div>
        <div class="mb-3">
            <label for="nodeID" class="form-label">Node ID</label>
            <select class="form-control" name="nodeID" required>
                {% for node in nodes %}
                <option value="{{ node[0] }}">{{ node[1] }}</option>
                {% endfor %}
            </select><br>
        </div>
        <button type="submit" class="btn btn-success">Add Asset</button>
    </form>
</div>
</body>
</html>
