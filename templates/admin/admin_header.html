<div class="container-fluid bg-primary py-3 hstack gap-3 sticky-top">
    <div class="">
        <a class="btn btn-primary" data-bs-toggle="offcanvas" href="#offcanvasAdminMenu" role="button" aria-controls="offcanvasAdminMenu">
            <svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
                ::before
                <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"></path>
            </svg>
        </a>
    </div>
    
    <div class="">
        <a href="/admin_dashboard">
            <h4 class="text-light">Welcome, {{ session['username'] }}</h4>
        </a>
    </div>

    <div class="ms-auto">
        <a href="{{ url_for('logout') }}" class="btn btn-danger" onclick="confirmLogout(event)">Logout</a>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasAdminMenu" aria-labelledby="offcanvasAdminMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasAdminmenuLabel">Admin Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <p>Select a table to manage:</p>
            <ul class="list-group">
                <li class="btn btn-warning list-group-item">
                    <a href="/projects" class="stretched-link">Manage Projects</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/pbts" class="stretched-link">Manage Customers</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/ifes" class="stretched-link">Manage IFES</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/members" class="stretched-link">Manage Members</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/state" class="stretched-link">Manage States</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/wilayah" class="stretched-link">Manage Wilayahs</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/zone" class="stretched-link">Manage Zones</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/node" class="stretched-link">Manage Nodes</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="{{ url_for('asset.manage_asset') }}" class="stretched-link">Manage Assets</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/product" class="stretched-link">Manage Product</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/user" class="stretched-link">Manage User</a>
                </li>
            </ul>
        </div>
    </div>
</div>
<script>
    function confirmLogout(event) {
        // Display a confirmation dialog
        const isConfirmed = confirm("Are you sure you want to logout?");
        if (!isConfirmed) {
            // Prevent the default action if the user cancels
            event.preventDefault();
        }
    }
</script>
