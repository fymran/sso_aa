<!-- templates/assign_team.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Assign IFES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='image/ssoaa_logo.jpg') }}">
</head>
<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning mt-3">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
<div class="container mt-5">
    <h2>Assign Member to IFES Leaders</h2>
    <form method="POST" action="{{ url_for('members.assign_team', member_id=member_id) }}">
        <div class="form-group">
            <label for="wilayah">Select Wilayah:</label>
            <select name="wilayahID" id="wilayahID" class="form-control" required>
                <option value="">-- Select Wilayah --</option>
                {% for wilayah in wilayahs %}
                <option value="{{ wilayah[0] }}">{{ wilayah[1] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group mt-3">
            <label for="ifes">IFES Leaders in Selected Wilayah:</label>
            <div id="ifes_list">
                <!-- List of IFES leaders will be dynamically loaded here -->
            </div>
        </div>
        <button type="submit" class="btn btn-success mt-3">Confirm Assignment</button>
        <a href="/members" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>

<script>
    $(document).ready(function(){
        // When a wilayah is selected, fetch the IFES leaders
        $('#wilayahID').change(function(){
            var wilayahID = $(this).val();

            // Only trigger the AJAX request if wilayahID is not empty
            if (wilayahID && wilayahID !== '') {
                // Construct the correct URL using a proper format
                $.ajax({
                    url: "{{ url_for('members.get_ifes_leaders', wilayah_id='WILAYAHID') }}".replace('WILAYAHID', wilayahID),
                    method: "GET",
                    success: function(data){
                        $('#ifes_list').html(data);
                    }
                });
            } else {
                $('#ifes_list').html('<p>Please select a valid wilayah.</p>');
            }
        });
    });
</script>

</body>
</html>
