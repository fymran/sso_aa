<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Node</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning mt-3">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
    <div class="container mt-5">
        <h2>Edit Node</h2>
        <form action="{{ url_for('node.edit_node', nodeID=node[0]) }}" method="POST">
            <div class="mb-3">
                <label for="nodeCode" class="form-label">Node Code</label>
                <input type="text" class="form-control" id="nodeCode" name="nodeCode" value="{{ node[1] }}" required>
            </div>

            <div class="mb-3">
                <label for="nodeName" class="form-label">Node Name</label>
                <input type="text" class="form-control" id="nodeName" name="nodeName" value="{{ node[2] }}" >
            </div>

            <div class="mb-3">
                <label for="zoneID" class="form-label">Zone</label>
                <select class="form-control" id="zoneID" name="zoneID" required>
                    {% for zone in zones %}
                    <option value="{{ zone[0] }}"> {{ zone[1]}}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('node.node_list') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
