<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>User List</h2>
    <a href="/admin_dashboard" class="btn btn-secondary">dashboard</a>
    <!-- Add new user button -->
    <a href="{{ url_for('user.add_user') }}" class="btn btn-primary mb-3">Add New user</a>

    <!-- users table -->
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Username</th>
            </tr>
        </thead>
        <tbody>
            {% for user in user %}
            <tr>
                <td>{{ loop.index }}</td> <!-- user ID -->
                <td>{{ user[1] }}</td> <!-- Username -->

                <!-- Actions for edit, delete -->
                <td>
                    <a href="{{ url_for('user.edit_user', user_id=user[0]) }}" class="btn btn-warning">Edit</a>
                    <form action="{{ url_for('user.delete_user', user_id=user[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this user?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
