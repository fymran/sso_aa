<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Zones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Zone List</h2>
    <a href="/admin_dashboard" class="btn btn-secondary">Dashboard</a>
    <a href="{{ url_for('zone.add_zone') }}" class="btn btn-success">Add New Zone</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Zone Name</th>
                <th>Wilayah Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for zone in zones %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ zone[1] }}</td>
                <td>{{ zone[2] }}</td>
                <td>
                    <a href="{{ url_for('zone.edit_zone', zoneID=zone[0]) }}" class="btn btn-primary">Edit</a>
                    <form action="{{ url_for('zone.delete_zone', zoneID=zone[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
