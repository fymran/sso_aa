<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin - State</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
<body>
    {% include '/admin/admin_header.html' %}
<div class="container mt-5">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning mt-3">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
    <div class="accordion" id="accordionExample">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button style="background-color:cadetblue" class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseTwo">
                    <h4>Add New State</h4>
                </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                <div class="accordion-body" style="background-color: rgb(155, 188, 205);">
                    <form action="{{ url_for('state.add_state') }}" method="POST">
                        <div class="mb-3">
                            <label for="stateCode" class="form-label">State Code</label>
                            <input type="text" class="form-control" id="stateCode" name="stateCode" required>
                        </div>
                        <div class="mb-3">
                            <label for="stateName" class="form-label">State Name</label>
                            <input type="text" class="form-control" id="stateName" name="stateName" required>
                        </div>
                        <button type="submit" class="btn btn-success">Add State</button>
                        <a href="/state" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div> 
    <h2>State List</h2>
    <div class="overflow-y-scroll" style="max-height: 600px;">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>State Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for state in states %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ state[1] }}</td>
                    <td>
                        <a data-bs-toggle="offcanvas" data-bs-target="#offcanvasEdit{{ state[0] }}" aria-controls="offcanvasEdit" class="btn btn-primary">Edit</a>
                        <form action="{{ url_for('state.delete_state', stateCode=state[0]) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?');">Delete</button>
                        </form>
                    </td>
                </tr>

                <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasEdit{{ state[0] }}" aria-labelledby="offcanvasEditLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasEditLabel">Edit State</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <form action="{{ url_for('state.edit_state', stateCode=state[0]) }}" method="POST">
                            <div class="mb-3">
                                <label for="stateName{{ state[0] }}" class="form-label">State Name</label>
                                <input type="text" class="form-control" id="stateName{{ state[0] }}" name="stateName" value="{{ state[1] }}" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Update State</button>
                            <a href="/state" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
                {% endfor %}
            </tbody>        
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
