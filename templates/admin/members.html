<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Members List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Homepage</a>

    <h2>Members List</h2>

    <!-- Flash message
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-success">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Add new member button -->
    <a href="{{ url_for('members.add_member') }}" class="btn btn-primary mb-3">Add New Member</a>
    <a href="visual_ifes_members" class="btn btn-primary mb-3">View team</a>


    <!-- Members table -->
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for member in members %}
            <tr>
                <td>{{ loop.index }}</td> <!-- Member ID -->
                <td>{{ member[1] }}</td> <!-- Email -->

                <!-- Actions for edit, delete, and assign -->
                <td>
                    <a href="{{ url_for('members.edit_member', member_id=member[0]) }}" class="btn btn-warning">Edit</a>
                    <form action="{{ url_for('members.delete_member', member_id=member[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this member?');">Delete</button>
                    </form>
                    <a href="{{ url_for('team.assign_team', member_id=member[0]) }}" class="btn btn-info">Assign Team</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
