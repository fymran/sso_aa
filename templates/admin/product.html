<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin - Product</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='image/ssoaa_logo.jpg') }}">
    </head>
<body>
    {% include '/admin/admin_header.html' %}
<div class="container mt-5">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning mt-3">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
    <h2 style="text-align:center; font-size:50px; color:#e29928; font-weight: bold;">PRODUCT LIST</h2>
    <div class="accordion" id="accordionExample">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button style="background-color:cadetblue" class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseTwo">
                    <h4>Add New Product</h4>
                </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                <div class="accordion-body" style="background-color: rgb(155, 188, 205);">
                    <form action="/add_product" method="POST">
                        <div class="mb-3">
                            <label for="productName" class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="productName" name="productName" required>
                        </div>
                        <button type="submit" class="btn btn-success">Add</button>
                        <a href="/product" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div> 
<br>
    <div class="overflow-y-scroll" style="max-height: 600px;">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Product Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for product in product %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ product[1] }}</td>
                    <td>
                        <a data-bs-toggle="offcanvas" data-bs-target="#offcanvasEdit{{ product[0] }}" aria-controls="offcanvasEdit" class="btn btn-sm btn-warning">Edit</a>
                        <form action="{{ url_for('product.delete_product', productID=product[0]) }}" method="POST" style="display:inline-block;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                        </form>
                    </td>
                </tr>

                <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasEdit{{ product[0] }}" aria-labelledby="offcanvasEditLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasEditLabel">Edit Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <form action="/edit_product/{{ product[0] }}" method="POST">
                            <div class="mb-3">
                                <label for="productName{{ product[0] }}" class="form-label">Product name</label>
                                <input type="text" class="form-control" id="productName{{ product[0] }}" name="productName" value="{{ product[1] }}" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Update</button>
                            <a href="/product" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
