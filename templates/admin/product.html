<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning mt-3">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
<div class="container mt-5">
    <h2>Product List</h2>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Dashboard</a>
    <a href="{{ url_for('product.add_product') }}" class="btn btn-primary mb-3">Add New Product</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Product Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in product %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ product[1] }}</td>
                <td>
                    <a href="{{ url_for('product.edit_product', productID=product[0]) }}" class="btn btn-sm btn-warning">Edit</a>
                    <form action="{{ url_for('product.delete_product', productID=product[0]) }}" method="POST" style="display:inline-block;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
