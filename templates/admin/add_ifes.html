<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New IFES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning mt-3">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
<div class="container mt-5">
    <h3>Add New IFES</h3>
    <form action="{{ url_for('ifes.add_ifes') }}" method="POST">
        <div class="mb-3">
            <label for="ifesName" class="form-label">IFES Name</label>
            <input type="text" class="form-control" id="ifesName" name="ifesName" required>
        </div>
        <div class="mb-3">
            <label for="ifesEmail" class="form-label">IFES Email</label>
            <input type="email" class="form-control" id="ifesEmail" name="ifesEmail" required>
        </div>
        <div class="mb-3">
            <label for="wilayahID" class="form-label">Wilayah</label>
            <select class="form-control" id="wilayahID" name="wilayahID" required>
                {% for wilayah in wilayahs %}
                <option value="{{ wilayah[0] }}">{{ wilayah[1] }} ({{ wilayah[2] }})</option>
                {% endfor %}
            </select>
        </div>        
        <button type="submit" class="btn btn-success">Add IFES</button>
        <a href="/ifes" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
