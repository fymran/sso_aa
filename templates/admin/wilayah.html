<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Wilayah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Homepage</a>

    <h2>Wilayah List</h2>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Wilayah Code</th>
                <th>Wilayah Name</th>
                <th>State Code</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for wilayah in wilayahs %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ wilayah[1] }}</td>
                <td>{{ wilayah[2] }}</td>
                <td>{{ wilayah[3] }}</td>
                <td>
                    <a href="{{ url_for('wilayah.edit_wilayah', wilayahID=wilayah[0]) }}" class="btn btn-primary">Edit</a>
                    <form action="{{ url_for('wilayah.delete_wilayah', wilayahID=wilayah[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>        
    </table>
    <a href="{{ url_for('wilayah.add_wilayah') }}" class="btn btn-success">Add New Wilayah</a>
</div>
</body>
</html>
