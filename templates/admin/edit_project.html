<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Edit Project</h2>
    <form action="/edit_project/{{ project[0] }}" method="POST">
        <div class="mb-3">
            <label for="projCode" class="form-label">Project Code</label>
            <input type="text" class="form-control" id="projCode" name="projCode" value="{{ project[1] }}" >
        </div>
        <div class="mb-3">
            <label for="projName" class="form-label">Project Name</label>
            <input type="text" class="form-control" id="projName" name="projName" value="{{ project[2] }}" required>
        </div>
        <div class="mb-3">
            <label for="productID" class="form-label">Product</label>
            <select class="form-control" name='productID' id='productID' required>
                <option value=1>Smart Surveillance</option>
                <option value=2>Smart Traffic</option>
                <option value=3>Smart Building</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="costCentre" class="form-label">Cost Centre</label>
            <input type="text" class="form-control" id="costCentre" name="costCentre" >
        </div>
        <button type="submit" class="btn btn-primary">Update Project</button>
        <a href="/projects" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
