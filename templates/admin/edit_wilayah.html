<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Wilayah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning mt-3">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
<div class="container mt-5">
    <h2>Edit Wilayah</h2>
    <form action="{{ url_for('wilayah.edit_wilayah', wilayahID=wilayah[0]) }}" method="POST">
        <div class="mb-3">
            <label for="wilayahCode" class="form-label">Wilayah Code</label>
            <input type="text" class="form-control" id="wilayahCode" name="wilayahCode" value="{{ wilayah[1] }}" required>
        </div>
        <div class="mb-3">
            <label for="wilayahName" class="form-label">Wilayah Name</label>
            <input type="text" class="form-control" id="wilayahName" name="wilayahName" value="{{ wilayah[2] }}" required>
        </div>
        <div class="mb-3">
            <label for="stateCode" class="form-label">State Code</label>
            <select class="form-control" id="stateCode" name="stateCode" required>
                <option value=null>Select State</option>
                {% for state in states %}
                <option value="{{ state[0] }}" {% if state[0] == wilayah[3] %}selected{% endif %}>{{ state[0] }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Update Wilayah</button>
        <a href="/wilayah" class="btn btn-secondary">cancel</a>
    </form>    
</div>
</body>
</html>
