<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin - Main Menu</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='image/ssoaa_logo.jpg') }}">
    </head>

    <!-- Include the header template -->
    {% include 'admin/admin_header.html' %}

<body>
<div class="container mt-5">
    <div class="text-center">
        <h1 style="font-size:50px; color:#e29928; font-weight: bold;">ADMIN MAIN MENU</h1>
    </div>
    <p class="text-center">Select a table to manage:</p>
    <div class="row">
        <!-- Left stack -->
        <div class="col-md-6">
            <ul class="list-group mb-3">
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/projects">Manage Project</a>
                </li>
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/pbts">Manage PBT</a>
                </li>
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/ifes">Manage IFES</a>
                </li>
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/members">Manage Member</a>
                </li>
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/state">Manage State</a>
                </li>
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/wilayah">Manage Wilayah</a>
                </li>
            </ul>
        </div>
        <!-- Right stack -->
        <div class="col-md-6">
            <ul class="list-group mb-3">
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/zone">Manage Zone</a>
                </li>
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/node">Manage Node</a>
                </li>
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="{{ url_for('asset.manage_asset') }}">Manage Asset</a>
                </li>
                <li class="btn btn-warning list-group-item mb-2">
                    <a href="/product">Manage Product</a>
                </li>
                <li class="btn btn-warning list-group-item">
                    <a href="/user">Manage User</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
