<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Select Project</h1>
        <a href="/admin_dashboard" class="btn btn-secondary">Dashboard</a>
        <form method="POST" action="{{ url_for('asset.manage_asset') }}"><br>
            <label for="projectID" class="form-label">Project:</label>
            <select class="form-control" name="projectID" id="projectID">
                {% for project in projects %}
                <option value="{{ project[0] }}">{{ project[1] }}</option>
                {% endfor %}
            </select>
            <input type="hidden" name="projectCode" id="projectCode">
            <br>
            <button type="submit" class="btn btn-primary">Manage Assets</button>
        </form>
    </div>
</body>
</html>
