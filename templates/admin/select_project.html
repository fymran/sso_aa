<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Select Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='image/ssoaa_logo.jpg') }}">
</head>

<body>
    {% include '/admin/admin_header.html' %}
<div class="container mt-5">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning mt-3">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
        <h1><b>Select Project</b></h1>
        <form method="POST" action="{{ url_for('asset.manage_asset') }}">
            <label for="projectID" class="form-label">Project:</label>
            <select class="form-control" name="projectID" id="projectID">
                {% for project in projects %}
                <option value="{{ project[0] }}">{{ project[1] }}</option>
                {% endfor %}
            </select>
            <input type="hidden" name="projectCode" id="projectCode">
            <br>
            <button type="submit" class="btn btn-warning">Manage Assets</button>
        </form>
</div>

<!-- Include Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
