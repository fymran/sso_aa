<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Nodes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Node List</h2>
    <a href="/admin_dashboard" class="btn btn-secondary">Dashboard</a>
    <a href="/add_node" class="btn btn-primary">Add New Node</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Node Code</th>
                <th>Node Name</th>
                <th>Zone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for node in nodes %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ node[1] }}</td>
                <td>{{ node[2] }}</td>
                <td>{{ node[3] or 'N/A' }}</td> <!-- Show 'N/A' if zoneName is NULL -->
                <td>
                    <a href="{{ url_for('node.edit_node', nodeID=node[0]) }}" class="btn btn-primary">Edit</a>
                    <form action="{{ url_for('node.delete_node', nodeID=node[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>        
    </table>   
</div>
</body>
</html>
