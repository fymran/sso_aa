<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage IFES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning mt-3">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
<div class="container mt-5">
    <h2>IFES List</h2>
    <a href="/add_ifes" class="btn btn-primary mb-3">Add New IFES</a>
    <a href="/admin_dashboard" class="btn btn-secondary">dashboard</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Email</th>
                <th>Wilayah</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for ifes in ifes %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ ifes[1] }}</td>
                <td>{{ ifes[2] }}</td>
                <td> {{ ifes[4] }}</td> <!-- Show wilayahName (wilayahCode) -->
                <td>
                    <a href="{{ url_for('ifes.edit_ifes', ifesID=ifes[0]) }}" class="btn btn-primary">Edit</a>
                    <form action="{{ url_for('ifes.delete_ifes', ifesID=ifes[0]) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>        
    </table>
</div>
</body>
</html>
