<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Wilayah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Add New Wilayah</h2>
    <form action="{{ url_for('wilayah.add_wilayah') }}" method="POST">
        <div class="mb-3">
            <label for="wilayahCode" class="form-label">Wilayah Code</label>
            <input type="text" class="form-control" id="wilayahCode" name="wilayahCode" required>
        </div>
        <div class="mb-3">
            <label for="wilayahName" class="form-label">Wilayah Name</label>
            <input type="text" class="form-control" id="wilayahName" name="wilayahName" required>
        </div>
        <div class="mb-3">
            <label for="stateCode" class="form-label">State Code</label>
            <select class="form-control" id="stateCode" name="stateCode" required>
                {% for state in states %}
                <option value="{{ state[0] }}">{{ state[0] }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Add Wilayah</button>
        <a href="/wilayah" class="btn btn-secondary">cancel</a>
    </form>    
</div>
</body>
</html>
