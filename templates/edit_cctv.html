<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit CCTV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Edit CCTV</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="cctvID" class="form-label">CCTV ID:</label>
            <input type="text" class="form-control" id="cctvID" name="cctvID" value="{{ cctv[0] }}" readonly>
        </div>
        <div class="mb-3">
            <label for="pbtID" class="form-label">PBT ID:</label>
            <input type="text" class="form-control" id="pbtID" name="pbtID" value="{{ cctv[1] }}">
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address:</label>
            <input type="text" class="form-control" id="address" name="address" value="{{ cctv[2] }}">
        </div>
        <div class="mb-3">
            <label for="coordiNorth" class="form-label">North Coordinate:</label>
            <input type="text" class="form-control" id="coordiNorth" name="coordiNorth" value="{{ cctv[3] }}">
        </div>
        <div class="mb-3">
            <label for="coordiEast" class="form-label">East Coordinate:</label>
            <input type="text" class="form-control" id="coordiEast" name="coordiEast" value="{{ cctv[4] }}">
        </div>
        <div class="mb-3">
            <label for="postcode" class="form-label">Postcode:</label>
            <input type="text" class="form-control" id="postcode" name="postcode" value="{{ cctv[5] }}">
        </div>
        <!-- Add other fields (projCode, wilayahID, etc.) -->
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="/cctvs" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
