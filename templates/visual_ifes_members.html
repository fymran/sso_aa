<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IFES & Members by Wilayah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>IFES & Members Grouped by Wilayah</h2>

    {% for wilayah, data in visual_data.items() %}
        <div class="card mt-3">
            <div class="card-header">
                <h4>{{ wilayah }}</h4> <!-- Wilayah Name -->
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>IFES Leaders</th>
                            <th>Members</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>
                                <ul>
                                    {% for ifes in data.ifes %}
                                        <li>{{ ifes }}</li> <!-- List IFES leaders under Wilayah -->
                                    {% endfor %}
                                </ul>
                            </td>
                            <td>
                                <ul>
                                    {% for member in data.members %}
                                        <li>{{ member }}</li> <!-- List all members for the Wilayah -->
                                    {% endfor %}
                                </ul>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
</body>
</html>
